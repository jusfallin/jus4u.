<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f5">
<title>Just a little surprise 💛</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#4a2732;background:linear-gradient(145deg,#fff7f5,#f8e9ef 48%,#eee5f7);display:grid;place-items:center}
.loader{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#fff7f5 0%,#f8e9ef 46%,#eee5f7 100%);transition:opacity .9s cubic-bezier(.22,1,.36,1)}
.loader:before,.loader:after{content:"";position:absolute;border-radius:50%;filter:blur(45px);opacity:.32;animation:drift 7s ease-in-out infinite alternate}.loader:before{width:300px;height:300px;background:#e6a4b8;top:-100px;left:-90px}.loader:after{width:320px;height:320px;background:#c9aee0;right:-120px;bottom:-120px;animation-delay:-3s}
.inner{position:relative;width:min(88vw,390px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px}.photoWrap{position:relative;width:174px;height:174px;margin-bottom:26px}.ring{position:absolute;inset:-11px;border:1px solid rgba(150,80,95,.25);border-radius:28px;animation:spin 10s linear infinite}.ring:before,.ring:after{content:"✦";position:absolute;color:#d39a54;font-size:14px;background:#fff7f5;padding:3px 6px;border-radius:50%}.ring:before{top:4px;left:15px}.ring:after{right:10px;bottom:8px}.photo{width:100%;height:100%;object-fit:contain;border-radius:22px;border:5px solid rgba(255,249,246,.95);background:rgba(255,255,255,.55);box-shadow:0 20px 55px rgba(90,45,70,.22),0 0 0 1px rgba(150,80,95,.12);animation:float 3.4s ease-in-out infinite}.thought{position:absolute;right:-18px;top:-5px;width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:#fffaf7;border:1px solid rgba(150,80,95,.16);box-shadow:0 8px 20px rgba(90,45,70,.12);font-size:24px;animation:thought 2.2s ease-in-out infinite}.thought:before,.thought:after{content:"";position:absolute;border-radius:50%;background:#fffaf7;border:1px solid rgba(150,80,95,.13)}.thought:before{width:11px;height:11px;left:-9px;bottom:4px}.thought:after{width:6px;height:6px;left:-15px;bottom:-4px}
.kicker{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:18px;color:#96505f;margin-bottom:7px;animation:textIn .9s .15s both}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,7vw,34px);font-weight:500;line-height:1.15;margin:0;color:#4a2732;animation:textIn .9s .28s both}.dots{margin:10px 0 24px;color:#8c6d76;min-height:20px}.dots span{display:inline-block;animation:dot 1.25s ease-in-out infinite;opacity:.25}.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}.progress{width:min(78vw,310px);height:7px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(150,80,95,.1),0 5px 18px rgba(90,45,70,.08);overflow:hidden}.bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#d78da2,#e5bf6c,#b987a8);box-shadow:0 0 16px rgba(215,141,162,.35)}.percent{margin-top:11px;font-size:11px;letter-spacing:.16em;color:#9b7c84;min-height:16px}.note{margin-top:19px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#a06978;opacity:.8}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes thought{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}@keyframes dot{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes textIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(22px,-18px,0) scale(1.08)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="loader" id="loader"><div class="inner">
<div class="photoWrap"><div class="ring"></div><img class="photo" src="/assets/IMG_20260818_203948.jpg?v=20260818-2050" alt=""><div class="thought">🤔</div></div>
<div class="kicker">Ennava irukum...</div><h1 class="title">Konjam iru, my yellow 🤔</h1>
<div class="dots"><span>•</span><span>•</span><span>•</span></div>
<div class="progress"><div class="bar" id="bar"></div></div><div class="percent" id="percent">0%</div>
<div class="note">something lovely is getting ready for you 💛</div>
</div></main>
<script>
(function(){
 const bar=document.getElementById('bar'),pct=document.getElementById('percent'),loader=document.getElementById('loader');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const duration=reduce?900:4200; const start=performance.now();
 function tick(now){const p=Math.min(1,(now-start)/duration),e=1-Math.pow(1-p,3),v=Math.floor(e*100);bar.style.width=v+'%';pct.textContent=v+'%';if(p<1)requestAnimationFrame(tick);else finish()}
 async function finish(){bar.style.width='100%';pct.textContent='100%';await new Promise(r=>setTimeout(r,reduce?120:520));
   try{const res=await fetch('/index.html?loader_bypass='+Date.now(),{cache:'no-store'});const html=await res.text();loader.style.opacity='0';await new Promise(r=>setTimeout(r,650));document.open();document.write(html);document.close();}
   catch(e){location.href='/index.html'}
 }
 requestAnimationFrame(tick);
})();
</script>
</body>
</html>
