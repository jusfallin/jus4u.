name: Fix myyellow love flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the love proposal flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = """    function hideContinue(){\\n      continueBtn.style.setProperty('display','none','important');\\n      continueBtn.setAttribute('aria-hidden','true');\\n    }\\n    function showContinue(){\\n      if(continueShown)return;\\n      continueShown=true;"""
          new1 = """    function hideContinue(){\\n      continueShown=false;\\n      continueBtn.style.setProperty('display','none','important');\\n      continueBtn.setAttribute('aria-hidden','true');\\n    }\\n    function showContinue(){\\n      if(continueShown)return;\\n      continueShown=true;"""

          old2 = """    document.addEventListener('click',function(e){\\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\\n      if(no)hideContinue();\\n    },true);"""
          new2 = """    document.addEventListener('click',function(e){\\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\\n      if(!no)return;\\n      /* Once YES has completed, NO must not be able to hide Continue or restart the cat sequence. */\\n      if(yesFinished || continueShown){\\n        e.preventDefault();\\n        e.stopImmediatePropagation();\\n        return;\\n      }\\n      hideContinue();\\n    },true);"""

          old3 = """    document.addEventListener('click',function(e){\\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\\n      if(!no||noBusy)return;\\n      e.preventDefault();e.stopImmediatePropagation();"""
          new3 = """    document.addEventListener('click',function(e){\\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\\n      if(!no)return;\\n      /* After YES, the proposal is finished; NO is intentionally inert so it cannot break Continue. */\\n      if(yesFinished || continueShown){\\n        e.preventDefault();\\n        e.stopImmediatePropagation();\\n        return;\\n      }\\n      if(noBusy)return;\\n      e.preventDefault();e.stopImmediatePropagation();"""

          for old, new in ((old1, new1), (old2, new2), (old3, new3)):
              old = old.replace('\\\\n', '\\n')
              new = new.replace('\\\\n', '\\n')
              if old not in s:
                  raise SystemExit('Expected patch target not found; refusing to change the file.')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix love proposal no-button flow" || true
          git rm -f .github/workflows/fix-no-button.yml || true
          git commit -m "Remove temporary fix workflow" || true
          git push
