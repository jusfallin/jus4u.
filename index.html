<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FADED2">
<meta name="robots" content="noindex,nofollow">
<title>Happy Birthday, Bhavanika 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root{--pink:#DC97A5;--pink2:#E8AAB5;--wine:#4A2732;--cream:#FFF9F6;--gold:#E8C66A;--bg:#FADED2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--wine);background:var(--bg);-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:
 radial-gradient(80% 55% at 50% 18%,rgba(255,249,246,.9),transparent 68%),
 radial-gradient(65% 50% at 10% 82%,rgba(220,151,165,.18),transparent 70%),
 radial-gradient(70% 55% at 94% 72%,rgba(232,198,106,.12),transparent 72%),
 linear-gradient(145deg,#FCE7DC 0%,#FADED2 45%,#F8D8CC 100%)}
.page:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 48%,rgba(255,249,246,.42),transparent 38%);animation:breath 5s ease-in-out infinite;pointer-events:none}
.content{position:relative;z-index:2;width:min(92vw,760px);padding:34px 20px 44px;text-align:center}
.eyebrow{font-size:clamp(10px,1.7vw,12px);font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#96505F;margin:0 0 clamp(18px,3vw,28px)}
.title{font-family:"Playfair Display",Georgia,serif;font-size:clamp(42px,9.5vw,92px);font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:uppercase;margin:0}
.name{font-family:"Great Vibes",cursive;font-size:clamp(66px,15vw,150px);line-height:.9;margin:10px 0 28px;background:linear-gradient(174deg,#E8AAB5,#DC97A5 35%,#BE7C8D 72%,#96505F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{width:clamp(58px,8vw,78px);height:clamp(58px,8vw,78px);margin:0 auto 30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#F0BFC6,#DC97A5 58%,#C98695);box-shadow:0 22px 42px -20px rgba(74,39,50,.45),inset 0 2px 7px rgba(255,255,255,.45);animation:float 3s ease-in-out infinite}
.badge svg{width:43%;fill:var(--cream)}
.message{font-size:clamp(15px,2.1vw,19px);line-height:1.8;max-width:48ch;margin:0 auto;color:rgba(74,39,50,.9)}
.signature{font-size:clamp(10px,1.5vw,12px);letter-spacing:.3em;text-transform:uppercase;color:#96505F;margin:26px 0 34px}
.divider{height:1px;width:70px;margin:0 auto 28px;background:linear-gradient(90deg,transparent,var(--pink),var(--gold),transparent)}
.enter{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:18px 38px;border:0;border-radius:999px;cursor:pointer;text-decoration:none;color:var(--cream);font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;background:linear-gradient(140deg,#E7A9B4,#DC97A5 48%,#CE8A99);box-shadow:0 18px 38px -16px rgba(220,151,165,.9);animation:beckon 1.8s ease-in-out infinite;transition:transform .35s ease,box-shadow .35s ease}
.enter:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 25px 48px -14px rgba(220,151,165,1)}
.enter:active{transform:scale(.97)}
.enter:focus-visible{outline:2px solid var(--wine);outline-offset:5px}
.heart{font-size:17px;line-height:1}
.petal{position:absolute;z-index:1;pointer-events:none;width:clamp(9px,1.6vw,15px);height:clamp(14px,2.4vw,22px);border-radius:100% 0 100% 0;background:linear-gradient(145deg,#F4C5CD,#DC97A5);opacity:.55;filter:blur(.1px);animation:fall linear infinite}
.p1{left:7%;top:-5%;animation-duration:10s;animation-delay:-2s;transform:rotate(25deg)}.p2{left:18%;top:-8%;animation-duration:13s;animation-delay:-8s}.p3{left:34%;top:-10%;animation-duration:11s;animation-delay:-4s}.p4{left:53%;top:-6%;animation-duration:14s;animation-delay:-11s}.p5{left:71%;top:-9%;animation-duration:12s;animation-delay:-6s}.p6{left:89%;top:-4%;animation-duration:15s;animation-delay:-10s}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:twinkle 2.8s ease-in-out infinite}.s1{left:17%;top:30%}.s2{right:13%;top:25%;animation-delay:.8s}.s3{left:11%;bottom:22%;animation-delay:1.4s}.s4{right:18%;bottom:18%;animation-delay:2s}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}12%{opacity:.6}50%{transform:translate3d(45px,52vh,0) rotate(170deg)}100%{transform:translate3d(-25px,115vh,0) rotate(350deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes beckon{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.045);box-shadow:0 22px 46px -14px rgba(220,151,165,1),0 0 0 10px rgba(220,151,165,.11)}}
@keyframes breath{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.06);opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.2}50%{transform:scale(1.35);opacity:.75}}
@media(max-width:520px){.content{padding:28px 18px 38px}.name{margin-top:6px;margin-bottom:24px}.message{max-width:34ch}.signature{margin-bottom:28px}.enter{min-height:56px;padding:17px 30px;letter-spacing:.22em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span>
  <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
  <section class="content" aria-label="Birthday welcome">
    <p class="eyebrow">A little celebration for you 🌸</p>
    <h1 class="title">Happy Birthday</h1>
    <p class="name">Bhavanika</p>
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 32 30"><path d="M16 29S1.6 20.2 1.6 10.8C1.6 5.6 5.6 1.8 10.3 1.8c3 0 5 1.6 5.7 3.2.7-1.6 2.7-3.2 5.7-3.2 4.7 0 8.7 3.8 8.7 9C30.4 20.2 16 29 16 29z"/></svg></div>
    <p class="message">You make every ordinary day feel beautiful.<br>Today is all about celebrating the beautiful person you are.</p>
    <p class="signature">With all my love, always</p>
    <div class="divider" aria-hidden="true"></div>
    <a class="enter" href="website%20file.html" aria-label="Enter the birthday celebration">Let's begin <span class="heart">💗</span></a>
  </section>
</main>
</body>
</html>
