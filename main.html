<style id="photo-layout-patch">
#hero{display:none!important}

#giftSection .memory-frame>img{

<script>
(function(){
  function replaceMemory(){
    const frame=document.querySelector('#memoryCard .memory-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg'); if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img');
    if(!img){img=document.createElement('img');frame.appendChild(img)}
    img.src='assets/file_000000004ab482088a7d776c072c4951.png?v=4';
    img.alt='A cherished selfie of us together';img.decoding='async';img.loading='eager';
    return true;
  }

  /* PHOTO #1: scratch-photo.jpg in the LEFT card of the first quote section. */
  function replaceFirstQuotePhoto(){
    const frame=document.querySelector('.split:not(.split--flip) .art-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg'); if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img.story-scratch-photo');
    if(!img){img=document.createElement('img');img.className='story-scratch-photo';frame.appendChild(img)}
    img.src='assets/scratch-photo.jpg?v=5';
    img.alt='A cherished photo of us together';img.decoding='async';img.loading='eager';
    return true;
  }

  /* PHOTO #2: her image.png in the RIGHT card of the second quote section. */
  function replaceSecondQuotePhoto(){
    const frame=document.querySelector('.split.split--flip .art-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg'); if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img.story-her-photo');
    if(!img){img=document.createElement('img');img.className='story-her-photo';frame.appendChild(img)}
    img.src='assets/her%20image.png?v=5';
    img.alt='Her photo';img.decoding='async';img.loading='eager';
    return true;
  }

  function apply(){
    const a=replaceMemory();
    const b=replaceFirstQuotePhoto();
    const c=replaceSecondQuotePhoto();
    return a||b||c;
  }
  if(!apply()){
    const observer=new MutationObserver(()=>{if(apply())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>observer.disconnect(),10000);
  }
})();

(function(){
  const assets=[
    'assets/03.jpg',
    'assets/07.jpg',
    'assets/08.jpg',
    'assets/IMG_20260730_235824.png'
  ];
  function findTargetSection(){
    const sections=[...document.querySelectorAll('section.sec')];
    return sections.find(sec=>{
      const text=(sec.textContent||'').replace(/\s+/g,' ').trim();
      return text.includes('Beyond the jokes and the chaos') && text.includes('Never lose that spark');
    })||null;
  }
  function addPolaroids(){
    const section=findTargetSection();
    if(!section)return false;
    if(section.querySelector('#polaroidMemoryPair'))return true;
    if(getComputedStyle(section).position==='static')section.style.position='relative';
    const layer=document.createElement('div');
    layer.id='polaroidMemoryPair';
    assets.forEach((src,i)=>{
      const card=document.createElement('figure');
      card.className='mini-polaroid '+['mini-left-1','mini-left-2','mini-right-1','mini-right-2'][i];
      const img=document.createElement('img');
      img.src=src+'?v=1';
      img.alt='A little memory';
      img.decoding='async';
      img.loading='lazy';
      card.appendChild(img);
      layer.appendChild(card);
    });
    section.appendChild(layer);
    return true;
  }
  if(!addPolaroids()){
    const observer=new MutationObserver(()=>{if(addPolaroids())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>observer.disconnect(),12000);
  }
})();
<\/script>`;

})();
</script>
