<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday 💗</title>
<style>html,body{margin:0;min-height:100%;background:#FADED2}body{overflow-x:hidden}</style>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('website%20file.html',{cache:'no-store'});
    if(!r.ok) throw new Error('birthday page unavailable');
    let h=await r.text();
    const patch=`
<style id="photo-layout-patch">
#hero{display:none!important}

/* Replace the flower illustration with the uploaded portrait. */
#giftSection{min-height:100svh;display:flex;align-items:center;padding:clamp(18px,3svh,34px) 0}
#giftSection .memory-wrap{width:min(76vw,500px);margin:0 auto}
#giftSection .memory-card{width:100%;transform:rotate(0deg)!important}
#giftSection .memory-frame{
  position:relative;width:100%!important;height:auto!important;
  aspect-ratio:1667/944!important;overflow:hidden!important;display:block!important;
  background:#f8e8e1!important;border-radius:10px!important;
  box-shadow:0 24px 50px rgba(96,55,67,.16),0 4px 14px rgba(96,55,67,.08)!important;
}
#giftSection .memory-frame::before{
  content:"";position:absolute;inset:-10%;
  background-image:url('assets/her%20image.png?v=3');background-size:cover;background-position:center;
  filter:blur(24px);transform:scale(1.12);opacity:.28;
}
#giftSection .memory-frame>img{
  position:relative;z-index:1;display:block!important;
  width:100%!important;height:100%!important;max-width:none!important;
  object-fit:contain!important;object-position:center!important;
  image-rendering:auto!important;background:rgba(255,249,246,.16)!important;
}
#giftSection .memory-card .art-cap{padding:10px 8px 4px;font-size:clamp(18px,2vw,28px)}
@media(max-width:719px){#giftSection .memory-wrap{width:min(92vw,430px)}}
@media(min-width:900px) and (max-height:760px){#giftSection .memory-wrap{width:min(62svh,500px)}}
</style>
<script>
(function(){
  function setMemoryImage(){
    const frame=document.querySelector('#memoryCard .memory-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg');
    if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img');
    if(!img){img=document.createElement('img');frame.appendChild(img)}
    img.src='assets/her%20image.png?v=3';
    img.alt='Her beautiful photo';
    img.decoding='async';
    img.loading='eager';
    return true;
  }
  if(!setMemoryImage()){
    const observer=new MutationObserver(()=>{if(setMemoryImage())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>observer.disconnect(),10000);
  }
})();
<\/script>`;
    h=h.replace(/<\/body>/i,patch+'</body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font:16px system-ui;color:#4A2732;background:#FADED2">One moment 💗</main>';
  }
})();
</script>
</body>
</html>
