<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday 💗</title>
<style>html,body{margin:0;min-height:100%;background:#FADED2}body{overflow-x:hidden}</style>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('website%20file.html',{cache:'no-store'});
    if(!r.ok) throw new Error('birthday page unavailable');
    let h=await r.text();
    const patch=`
<style id="photo-layout-patch">
.view#viewStory>main#world>section.sec:nth-of-type(2) .art-frame{overflow:hidden}
.view#viewStory>main#world>section.sec:nth-of-type(2) .story-photo{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important}
#giftSection{min-height:100svh;display:flex;align-items:center;padding:clamp(16px,3svh,32px) 0}
#giftSection .memory-wrap{width:min(48svh,390px);margin:clamp(8px,1.5svh,18px) auto 0}
#giftSection .memory-card{width:100%}
#giftSection .memory-frame{width:100%!important;aspect-ratio:1/1!important;height:auto!important;overflow:hidden!important;display:block!important}
#giftSection .memory-frame>img{display:block!important;width:100%!important;height:100%!important;aspect-ratio:1/1!important;object-fit:cover!important;object-position:center center!important}
#giftSection .memory-card .art-cap{padding:10px 8px 2px;font-size:clamp(19px,2vw,28px)}
@media(max-width:719px){#giftSection .memory-wrap{width:min(84vw,350px)}}
@media(min-width:900px) and (max-height:760px){#giftSection .memory-wrap{width:min(44svh,330px)}}
</style>
<script>
(function(){
  function setMemoryImage(){
    const frame=document.querySelector('#memoryCard .memory-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg');
    if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img');
    if(!img){img=document.createElement('img');frame.appendChild(img)}
    img.src='assets/bhavanika.jpg';
    img.alt='A cherished selfie of us together';
    img.decoding='async';
    img.loading='eager';
    return true;
  }
  function setStoryImage(){
    const frame=document.querySelector('#viewStory>main#world>section.sec:nth-of-type(2) .art-frame');
    if(!frame)return false;
    const oldSvg=frame.querySelector('svg');
    if(oldSvg)oldSvg.remove();
    let img=frame.querySelector('img.story-photo');
    if(!img){img=document.createElement('img');img.className='story-photo';frame.prepend(img)}
    img.src='assets/scratch-photo.jpg';
    img.alt='A cherished photo of us together';
    img.decoding='async';
    img.loading='eager';
    return true;
  }
  function apply(){return setMemoryImage()&&setStoryImage()}
  if(!apply()){
    const observer=new MutationObserver(()=>{if(apply())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>observer.disconnect(),8000);
  }
})();
<\/script>`;
    h=h.replace(/<\/body>/i,patch+'</body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font:16px system-ui;color:#4A2732;background:#FADED2">One moment 💗</main>';
  }
})();
</script>
</body>
</html>
